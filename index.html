<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a26" />
    <title>풍운 · Flight study</title>
  </head>
  <body>
    <main class="shell">
      <header><a class="wordmark" href="./">풍운 <span>FLIGHT STUDY</span></a><span class="tag">PROTOTYPE / 001</span></header>
      <section class="intro"><div><p class="eyebrow">SIDE-SCROLLING SHOOTER</p><h1>바람을 가르는 첫 비행<span>FIRST FLIGHT</span></h1></div><p class="intro-note">이동과 사격을 연습하세요.<br />아직은 고요한 하늘입니다.</p></section>
      <section class="stage" aria-label="게임 화면"><div id="game"></div></section>
      <section class="controls" aria-label="게임 조작">
        <div class="control-note"><span class="status-dot"></span><div>FREE FLIGHT <small>방향키로 이동 · SPACE / Z로 발사</small></div></div>
        <div class="touch-controls"><div class="dpad" aria-label="이동"><button data-move="up" aria-label="위로 이동">↑</button><button data-move="left" aria-label="왼쪽으로 이동">←</button><button data-move="down" aria-label="아래로 이동">↓</button><button data-move="right" aria-label="오른쪽으로 이동">→</button></div><button id="fire" aria-label="공격">FIRE <span>↗</span></button></div>
      </section>
      <footer><span>01 — MOVEMENT & SHOT</span><span>ORIGINAL PLACEHOLDER GRAPHICS · PHASER 3</span></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
